# Configuracion comun a todos los entornos. No contiene credenciales:
# - local: application-local.yaml (spring-boot:run lo activa por defecto)
# - prod:  application-prod.yaml (Render, SPRING_PROFILES_ACTIVE=prod)
# - pruebas: PostgreSQL de Testcontainers via @ServiceConnection
# Sin perfil, la conexion se toma de SPRING_DATASOURCE_URL/USERNAME/PASSWORD o el arranque falla.
spring:
  application:
    name: mcg-backend
  datasource:
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
